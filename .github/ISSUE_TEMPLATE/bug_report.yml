name: Bug report
description: Wrong edges, a wrong graph, a crash, or unexpected extraction behaviour
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach a client workbook.** If the problem only reproduces on a
        confidential model, email the same report privately to
        **security@opioinc.com** instead — see
        [SECURITY.md](https://github.com/gaspatchio/xl-marinade/blob/main/SECURITY.md).
        That path covers ordinary bugs, not just vulnerabilities.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >-
        What did you run, and what went wrong? A wrong or missing edge matters as
        much as a crash — say which edge you expected and which you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      description: >-
        The smallest workbook that shows it. A generator snippet (openpyxl, or
        `test_workbook_generator/`) is ideal — it is shareable where a real
        workbook is not. Failing that, describe the formula shape: the range
        pattern, whether ranges overlap, how many sheets.
      render: python
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected instead (an edge, a breadth, an error message).
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: xl-marinade version
      placeholder: e.g. 0.2.0 (from pip show xl-marinade)
    validations:
      required: true
  - type: input
    id: schema-version
    attributes:
      label: Database schema_version
      description: "SELECT value FROM ir_metadata WHERE key = 'schema_version'"
      placeholder: e.g. 3.0
    validations:
      required: false
  - type: dropdown
    id: tier
    attributes:
      label: Which tier?
      description: The deterministic path makes no network calls; enrichment is opt-in.
      options:
        - Deterministic only (no API key configured)
        - With --enrich (LLM documentation / VBA enrichment)
        - Not sure
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: e.g. Python 3.12, macOS 15
    validations:
      required: false
