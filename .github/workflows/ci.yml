name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded in-progress run on the same ref (e.g. rapid pushes to a
# branch or PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is not optional cover: a user hit a cp1252 decode
        # crash on EVERY workbook (issue #18) that a POSIX/UTF-8 runner cannot
        # reproduce. macOS keeps the third path-and-filesystem flavour honest.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
        include:
          # The interpreter the field report came from.
          - os: windows-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install dependencies
        # --all-extras installs the [llm] (openai) + [vba] (oletools) extras the
        # suite exercises; the dev group brings networkx (DiGraph backend) + tools.
        run: uv sync --frozen --group dev --all-extras
      # The tier-boundary + import-cleanliness gates run inside this pytest
      # invocation as ordinary tests (no separate job needed):
      #   test_docs_no_llm, test_core_no_egress, test_import_cleanliness,
      #   test_core_no_llm_dep, test_core_no_docagent
      - name: Run tests
        # pyproject sets pythonpath=src for pytest, so no shell-specific env
        # prefix is needed (the old PYTHONPATH=src form is not valid on
        # Windows' default shell).
        run: uv run pytest tests/ -q

  # The branch ruleset requires a check named exactly "Tests". Matrix jobs
  # report one context per leg ("Tests (windows-latest, py3.13)"), so making
  # `tests` a matrix removed the required context entirely — every PR would
  # wait forever on a check that can no longer report. This job keeps that one
  # name stable and green only when every leg passed, so the matrix can grow or
  # shrink without touching branch protection.
  tests-gate:
    name: Tests
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to have succeeded
        run: |
          echo "matrix result: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "latest"
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Check the lockfile is current
        # CONTRIBUTING tells contributors to run `uv sync --locked`; without
        # this gate a pyproject change without a relock leaves that command
        # failing on a fresh clone while CI stays green (`--frozen` skips the
        # check, and a later bare `uv run` silently re-locks on the runner).
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Run ruff check
        run: uv run ruff check .
      - name: Run ruff format check
        run: uv run ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-latest
    # Blocking on the typed surface: the public API + already-clean modules must
    # stay mypy- and pyright-clean. Modules carrying pre-existing type debt are
    # listed in [tool.mypy.overrides] / [tool.pyright].exclude in pyproject and
    # deferred from the gate; an incremental typing pass removes them over time.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "latest"
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install dependencies
        run: uv sync --frozen --group dev --all-extras
      - name: Run mypy
        run: PYTHONPATH=src uv run mypy src/xl_marinade
      - name: Run pyright
        run: PYTHONPATH=src uv run pyright src/xl_marinade
