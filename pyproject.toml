    "xl_marinade.core.resolution_strategies",
    "xl_marinade.core.resolution",
    "xl_marinade.core.time_axis_inference",
    "xl_marinade.core.time_dependence",
    "xl_marinade.core.topology",
    "xl_marinade.core.vba_parser",
    "xl_marinade.core.vba.extractor",
    "xl_marinade.core.vba.reference_extractor",
    "xl_marinade.docs.apply_actuarial_classification",
    "xl_marinade.docs.classifiers.actuarial",
