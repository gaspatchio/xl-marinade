    "xl_marinade.core.new_arch.formula_normalizer",
    "xl_marinade.core.new_arch.grouping_native",
    "xl_marinade.core.new_arch.memory_budget",
    "xl_marinade.core.new_arch.offset_edges",
    "xl_marinade.core.new_arch.reference_extractor",
    "xl_marinade.core.new_arch.table_candidates",
    "xl_marinade.core.new_arch.telemetry",
